# Base PostgreSQL locale pour le développement :  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chargerecup
      POSTGRES_PASSWORD: chargerecup
      POSTGRES_DB: chargerecup
    ports:
      - "5432:5432"
    volumes:
      - chargerecup-data:/var/lib/postgresql/data

volumes:
  chargerecup-data:
